plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hdlee.pdfnote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hdlee.pdfnote'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // A dedicated Play Store release should use a private keystore.
            // GitHub Releases use Android's standard debug key so the APK is directly installable.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
