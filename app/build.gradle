plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hdlee.pdfnote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hdlee.pdfnote'
        minSdk 26
        targetSdk 35
        versionCode 69
        versionName '1.56.0'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { testLogging { exceptionFormat = 'full' } }
    }

    signingConfigs {
        // Fixed key so every release/debug APK is signed identically and installs as an update.
        pdfnote {
            storeFile file('pdfnote-release.jks')
            storePassword 'pdfnote2026'
            keyAlias 'pdfnote'
            keyPassword 'pdfnote2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pdfnote
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.pdfnote
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'kr.dogfoot:hwplib:1.1.11'
    implementation 'org.apache.poi:poi-scratchpad:5.2.5'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
